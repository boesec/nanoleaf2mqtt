[package]
name = "nanoleaf2mqtt"
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
publish = false
license = "MIT"
description = "Bridge between Nanoleaf light panels and MQTT"
repository = "https://github.com/boesec/nanoleaf2mqtt"
readme = "README.md"
keywords = ["nanoleaf", "mqtt", "smarthome", "home-automation", "bridge"]
categories = ["network-programming", "command-line-utilities"]

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
todo = "warn"
dbg_macro = "warn"

[dependencies]
anyhow = "1"
# Hash of the configuration UI's admin password (argon2id, default parameters). The salt comes
# from `rand`, so the hash crate is built without its own random number feature.
argon2 = { version = "0.5", default-features = false, features = ["alloc", "password-hash"] }
askama = "0.16"
axum = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive", "env"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
# TLS to the broker is not supported yet, so rumqttc is built without it.
rumqttc = { version = "0.25", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zeroize = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "test-util", "net", "io-util"] }
rumqttd = { version = "0.20", default-features = false }
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
wiremock = "0.6"

# Password hashing is slow on purpose; unoptimised it would make every test that logs in crawl.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
