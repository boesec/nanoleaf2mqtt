# A tag v<version> builds static Linux binaries for three architectures and publishes them as a
# GitHub release, with SHA256SUMS and the version's CHANGELOG.md section as notes. Versions with
# a pre-release part (v0.2.0-rc.1) become pre-releases.
#
# The same build and packing runs locally with scripts/release-build.ps1.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # Zig, the C compiler and linker for cargo-zigbuild; the version the local build uses.
  ZIG_VERSION: 0.17.0

jobs:
  version:
    name: tag matches Cargo.toml
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - name: Install toolchain
        run: rustup toolchain install

      - name: Compare tag and version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(cargo metadata --no-deps --format-version 1 --locked \
            | jq -r '.packages[] | select(.name == "nanoleaf2mqtt") | .version')
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match the version $version in Cargo.toml"
            exit 1
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"

      - name: Release notes exist
        run: scripts/changelog-section.sh "${{ steps.version.outputs.version }}"

  checks:
    name: checks
    needs: version
    uses: ./.github/workflows/ci.yml

  build:
    name: build ${{ matrix.target }}
    needs: [version, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            emulator: ''
          - target: aarch64-unknown-linux-musl
            emulator: qemu-aarch64
          - target: armv7-unknown-linux-musleabihf
            emulator: qemu-arm
    steps:
      - uses: actions/checkout@v5

      - name: Install toolchain
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}

      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo zigbuild --release --locked --target ${{ matrix.target }}

      - name: Check the binary
        env:
          BINARY: target/${{ matrix.target }}/release/nanoleaf2mqtt
          EMULATOR: ${{ matrix.emulator }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          file "$BINARY"
          file "$BINARY" | grep -q 'statically linked'
          if [ -n "$EMULATOR" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq qemu-user
          fi
          # EMULATOR is empty for the native target and must split into no word at all.
          # shellcheck disable=SC2086
          out=$($EMULATOR "$BINARY" --version)
          echo "$out"
          [ "$out" = "nanoleaf2mqtt $VERSION" ]

      - name: Pack
        run: >-
          scripts/package-release.sh
          "${{ needs.version.outputs.version }}"
          "${{ matrix.target }}"
          "target/${{ matrix.target }}/release/nanoleaf2mqtt"
          dist

      - uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  release:
    name: publish release
    needs: [version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          pattern: archive-*
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: |
          ls -l
          [ "$(find . -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 3 ]
          sha256sum -- *.tar.gz >SHA256SUMS
          cat SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Release notes
        run: scripts/changelog-section.sh "${{ needs.version.outputs.version }}" >notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          prerelease=()
          case "$VERSION" in
            *-*) prerelease=(--prerelease) ;;
          esac
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "nanoleaf2mqtt $VERSION" \
            --notes-file notes.md \
            "${prerelease[@]}" \
            dist/*.tar.gz dist/SHA256SUMS
